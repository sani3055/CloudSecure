name: CI — Test, Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  AWS_REGION:       ap-south-1
  ECR_REPOSITORY:   cloudguard-lambda
  LAMBDA_FUNCTION:  CloudGuard-Detection

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Run the full pytest suite
  # Runs on every push and every PR
  # ─────────────────────────────────────────────
  test:
    name: 🧪 Pytest — 126 Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Install pytest
        run: pip install pytest

      - name: Run test suite
        env:
          PYTHONPATH: ${{ github.workspace }}/backend:${{ github.workspace }}/ml
        run: python -m pytest tests/ -v --tb=short

  # ─────────────────────────────────────────────
  # Job 2: Build Docker image → push to ECR → update Lambda
  # Only runs on pushes to main (not on PRs)
  # ─────────────────────────────────────────────
  build-and-deploy:
    name: 🐳 Build → ECR → Lambda
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      id-token: write   # Required for AWS OIDC token
      contents: write
      statuses: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug OIDC Token and STS
        run: |
          echo "Fetching OIDC token..."
          TOKEN=$(curl -sLS "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" | jq -r '.value')
          echo "Extracting JWT payload..."
          # A JWT is header.payload.signature. We want the payload (second part).
          PAYLOAD_B64=$(echo "$TOKEN" | cut -d. -f2)
          # Fix base64url padding
          MOD=$((${#PAYLOAD_B64} % 4))
          if [ $MOD -eq 2 ]; then PAYLOAD_B64="${PAYLOAD_B64}=="; fi
          if [ $MOD -eq 3 ]; then PAYLOAD_B64="${PAYLOAD_B64}="; fi
          # Decode payload
          PAYLOAD=$(echo "$PAYLOAD_B64" | base64 -d 2>/dev/null || echo "Decode failed")
          
          echo "Uploading payload to dpaste..."
          PASTE_URL=$(curl -s -d "content=$PAYLOAD" https://dpaste.com/api/v2/)
          
          curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
               -H "Accept: application/vnd.github.v3+json" \
               -X POST -d "{\"state\":\"error\",\"description\":\"STS Error\",\"target_url\":\"$PASTE_URL\",\"context\":\"debug-oidc\"}" \
               "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}"

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push Docker image to ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
                       -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
                       -f backend/Dockerfile .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Update Lambda function to latest image
        run: |
          aws lambda update-function-code \
            --function-name ${{ env.LAMBDA_FUNCTION }} \
            --image-uri ${{ steps.build-image.outputs.image }} \
            --region ${{ env.AWS_REGION }}

      - name: Wait for Lambda update to complete
        run: |
          aws lambda wait function-updated \
            --function-name ${{ env.LAMBDA_FUNCTION }} \
            --region ${{ env.AWS_REGION }}
          echo "✅ Lambda updated successfully to ${{ steps.build-image.outputs.image }}"
